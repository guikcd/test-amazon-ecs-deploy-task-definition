name: Deploy

on:
  push:
    branches: 
      - 'main'

jobs:
  prepare:
    runs-on: ubuntu-latest
    # These permissions are needed to interact with GitHub's OIDC Token endpoint.
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{secrets.AWS_ROLE_TO_ASSUME}}
          aws-region: ${{secrets.AWS_REGION}}

      - name: Runtask - Download task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@1.8.0
        with:
          task-definition-family: CdkFargateStackTaskDef424235B4
          container-name: java-app
          image: public.ecr.aws/aws-containers/retail-store-sample-ui:1.2.3
      - name: Copy to static filename
        run: |
          # Find the file (adjust pattern as needed)
          SOURCE_FILE=$(find ${{ runner.temp }} -type f -name "task-definition*.json" | head -n 1)
          
          if [ -f "$SOURCE_FILE" ]; then
            # Create a directory for the static file
            mkdir -p ${{ runner.temp }}/static
            # Copy with static name
            cp "$SOURCE_FILE" "${{ runner.temp }}/static/task-definition.json"
            echo "File copied to static name"
            ls -la ${{ runner.temp }}
            ls -la ${{ runner.temp }}/static
          else
            echo "No source file found"
            exit 1
          fi
      - name: Temporarily save task def
        uses: actions/upload-artifact@v4
        with:
          name: task-def
          path: ${{ runner.temp }}/static/task-definition.json
          if-no-files-found: error
          retention-days: 1
    outputs:
      task-definition: ${{ steps.task-def.outputs.task-definition }}

  deploy:
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{secrets.AWS_ROLE_TO_ASSUME}}
          aws-region: ${{secrets.AWS_REGION}}
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          name: task-def
          path: ${{ runner.temp }}/static/
      - name: Task def content
        run: |
          ls -al ${{ runner.temp }}/static/
          cat ${{ runner.temp }}/static/task-definition.json
      - name: Service - Deploy service to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2.3.4
        with:
          task-definition: ${{ runner.temp }}/static/task-definition.json
          service: CdkFargateStack-MyFargateServiceF490C034-3vI7RjKoHEVU
          cluster: CdkFargateStack-MyCluster4C1BA579-51NElzJUOOz5
          wait-for-service-stability: true
          enable-ecs-managed-tags: true
